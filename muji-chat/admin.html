<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUJI 助手 · 设备管理后台</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Microsoft YaHei", sans-serif; background: #f4f2ee; color: #333; }
header { background: #222; color: #fff; padding: 12px 18px; font-size: 15px; font-weight: 600; }
.wrap { max-width: 820px; margin: 0 auto; padding: 16px; }
.card { background: #fff; border: 1px solid #e7e1d6; border-radius: 10px; padding: 16px; margin-bottom: 14px; }
.card h3 { font-size: 14px; margin-bottom: 10px; color: #7a0000; }
select { width: 100%; padding: 9px 12px; border: 1px solid #d8d2c6; border-radius: 8px; font-size: 13px; margin-bottom: 8px; outline: none; }
button.main { background: #7a0000; color: #fff; border: none; border-radius: 8px; padding: 9px 22px; font-size: 13px; cursor: pointer; }
button.ghost { background: #fff; color: #7a0000; border: 1px solid #7a0000; border-radius: 8px; padding: 8px 16px; font-size: 13px; cursor: pointer; }
button.mini { background: #fff; color: #7a0000; border: 1px solid #ccc; border-radius: 6px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
.item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 6px; font-size: 13px; flex-wrap: wrap; }
.item code { font-size: 12px; word-break: break-all; color: #555; }
.item .meta { color: #999; font-size: 11px; flex: 1; min-width: 120px; }
.item .note { color: #7a0000; font-size: 12px; }
#msg { font-size: 13px; }
#msg.ok { color: #2a7a2a; } #msg.err { color: #b00; }
.note { color: #888; font-size: 12px; line-height: 1.6; }
.addrow { display: flex; gap: 8px; margin-top: 8px; }
.addrow input { flex: 1; padding: 8px 10px; border: 1px solid #d8d2c6; border-radius: 8px; font-size: 12px; outline: none; }
</style>
</head>
<body>
<header>MUJI 助手 · 设备管理后台（自动收集来访设备，点按钮即授权/屏蔽）</header>
<div class="wrap">

<div class="card">
  <h3>管控模式</h3>
  <select id="mode" onchange="saveAcl()">
    <option value="blacklist">黑名单模式：默认所有人可用，被拉黑的设备进不来</option>
    <option value="whitelist">白名单模式：只有「已授权设备」能进来（最安全）</option>
  </select>
  <span id="msg"></span>
  <div class="note" style="margin-top:6px">改动即保存。用户刷新页面后生效。每台设备第一次打开对话页时会自动出现在下面的「来访设备」里，你只需点按钮。</div>
</div>

<div class="card">
  <h3>🆕 来访设备（自动收集，未处理）</h3>
  <div id="visitList"><div class="note">加载中…</div></div>
</div>

<div class="card">
  <h3>✅ 已授权设备</h3>
  <div id="devList"></div>
</div>

<div class="card">
  <h3>🚫 已屏蔽设备</h3>
  <div id="banList"></div>
</div>

</div>
<script>
const KVDB = 'https://kvdb.io/Ks73CVNzBmXEcgUhaBfkFd';
let acl = {mode: 'blacklist', devices: [], banned: [], visits: []};
let visits = {};   // id -> {ts, ua}

function el(id){ return document.getElementById(id); }
function setStatus(text, cls) {
  const m = el('msg');
  m.textContent = text; m.className = cls || '';
}
function esc(s){ return (s||'').replace(/</g,'&lt;'); }

async function loadAll() {
  try {
    const [aclR, listR] = await Promise.all([
      fetch(KVDB + '/acl?t=' + Date.now(), {cache: 'no-store'}),
      fetch(KVDB + '/?t=' + Date.now(), {cache: 'no-store'})
    ]);
    acl = await aclR.json();
    const keys = (await listR.text()).split('\n').map(s => s.trim()).filter(s => s.startsWith('visits/'));
    const vals = await Promise.all(keys.map(k => fetch(KVDB + '/' + k + '?t=' + Date.now(), {cache: 'no-store'}).then(r => r.json()).catch(() => null)));
    visits = {};
    keys.forEach((k, i) => { if (vals[i]) visits[k.slice(7)] = vals[i]; });
    el('mode').value = acl.mode || 'blacklist';
    render();
    setStatus('✅ 已加载 ' + keys.length + ' 条来访记录', 'ok');
  } catch (e) {
    setStatus('❌ 加载失败：' + e.message, 'err');
  }
}
async function saveAcl() {
  acl.mode = el('mode').value;
  try {
    const r = await fetch(KVDB + '/acl', {method: 'PUT', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(acl)});
    setStatus(r.ok ? '✅ 已保存，用户刷新页面即生效' : '❌ 保存失败 ' + r.status, r.ok ? 'ok' : 'err');
  } catch (e) { setStatus('❌ 网络错误：' + e.message, 'err'); }
}
function render() {
  const devIds = (acl.devices || []).map(d => d.id);
  const banIds = (acl.banned || []).map(d => d.id);
  // 来访未处理
  const pending = Object.entries(visits).filter(([id]) => !devIds.includes(id) && !banIds.includes(id));
  el('visitList').innerHTML = pending.length ? pending.map(([id, v]) => `
    <div class="item">
      <code><b>${esc(id)}</b></code>
      <span class="meta">${esc(v && v.ts || '')}　${esc(v && v.ua || '')}</span>
      <button class="main" onclick="approve('${id}')">允许</button>
      <button class="ghost" onclick="ban('${id}')">拉黑</button>
    </div>`).join('') : '<div class="note">（暂无新设备——设备打开对话页后会自动出现在这里）</div>';
  // 已授权
  el('devList').innerHTML = (acl.devices || []).length ? (acl.devices).map((d, i) => `
    <div class="item"><code><b>${esc(d.id)}</b></code> <span class="note">${esc(d.note || '')}</span>
      <button class="mini" style="margin-left:auto" onclick="delItem('devices',${i})">取消授权</button></div>`).join('') : '<div class="note">（空）</div>';
  // 已屏蔽
  el('banList').innerHTML = (acl.banned || []).length ? (acl.banned).map((d, i) => `
    <div class="item"><code><b>${esc(d.id)}</b></code> <span class="note">${esc(d.note || '')}</span>
      <button class="mini" style="margin-left:auto" onclick="delItem('banned',${i})">解除拉黑</button></div>`).join('') : '<div class="note">（空）</div>';
}
function approve(id) {
  acl.devices = (acl.devices || []).filter(d => d.id !== id);
  acl.devices.push({id, note: ''});
  render(); saveAcl();
}
function ban(id) {
  acl.banned = (acl.banned || []).filter(d => d.id !== id);
  acl.banned.push({id, note: ''});
  acl.devices = (acl.devices || []).filter(d => d.id !== id);
  render(); saveAcl();
}
function delItem(key, i) {
  acl[key].splice(i, 1);
  render(); saveAcl();
}
loadAll();
</script>
</body>
</html>
