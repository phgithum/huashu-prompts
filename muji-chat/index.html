<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Microsoft YaHei", sans-serif; background: #f4f2ee; color: #333; }
header { background: #7a0000; color: #fff; padding: 12px 18px; }
header h1 { font-size: 16px; font-weight: 600; max-width: 1100px; margin: 0 auto; }

h2.sec { font-size: 15px; color: #7a0000; margin: 6px 0 10px; }
.searchbar { display: flex; gap: 8px; margin: 6px 0 12px; }
.searchbar input { flex: 1; padding: 11px 15px; border: 1px solid #d8d2c6; border-radius: 10px; font-size: 14px; outline: none; }
.searchbar input:focus { border-color: #7a0000; }
.hint { font-size: 12px; color: #999; margin-bottom: 10px; }
#grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.card { background: #fff; border: 1px solid #e7e1d6; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }

.card .t { font-size: 13px; line-height: 1.45; max-height: 3.6em; overflow: hidden; }
.card .p { color: #7a0000; font-weight: 700; font-size: 15px; }
.card .s { font-size: 11px; color: #999; }
.card .ops { display: flex; gap: 6px; margin-top: auto; padding-top: 6px; }
.card .ops button { flex: 1; border: 1px solid #7a0000; background: #fff; color: #7a0000; border-radius: 6px; padding: 5px 0; font-size: 12px; cursor: pointer; }
.card .ops button.solid { background: #7a0000; color: #fff; }
.card .ops button:hover { opacity: .85; }
#scriptBox { display: none; background: #fff; border: 1px solid #e7e1d6; border-radius: 10px; padding: 14px; margin: 12px 0; }
#scriptBox h3 { font-size: 14px; color: #7a0000; margin-bottom: 8px; }
#scriptBox .txt { font-size: 14px; line-height: 1.8; white-space: pre-wrap; }

#chatSec { margin-top: 26px; }

.msg { max-width: 82%; padding: 10px 14px; border-radius: 12px; line-height: 1.7; font-size: 14px; white-space: pre-wrap; }
.user { align-self: flex-end; background: #7a0000; color: #fff; border-bottom-right-radius: 3px; }
.bot { align-self: flex-start; background: #fff; border: 1px solid #e3ddd3; border-bottom-left-radius: 3px; }
.refs { align-self: flex-start; max-width: 90%; font-size: 12px; color: #666; background: #efeadf; border-radius: 8px; padding: 8px 12px; }

label.kb { font-size: 12px; color: #666; display: flex; align-items: center; gap: 4px; margin-bottom: 8px; }

<body>
<header><h1>MUJI 商品助手 —— 搜索商品 / 生成话术 / 知识问答</h1></header>
<div class="wrap">

<section id="searchSec">
  <h2 class="sec">🔍 商品搜索</h2>
  <div class="searchbar">
    <input id="q" placeholder="输入商品名称或 13 位条码 SKU，如：压缩沙发 / 4550723162258 / 毛衣">
  </div>
  <div class="hint">支持商品名片段、条码精确查询；点击卡片上的「生成话术」直接出销售文案，「去问答」带着该商品到底部继续问答。</div>
  <div id="scriptBox">
    <button class="close" onclick="document.getElementById('scriptBox').style.display='none'">关闭 ✕</button>
    <h3 id="scriptTitle"></h3>
    <div class="txt" id="scriptTxt"></div>
  </div>
  <div id="grid"></div>
</section>

<section id="chatSec">
  <h2 class="sec">💬 知识问答</h2>
  <div id="ctxwrap"></div>
  <label class="kb"><input type="checkbox" id="useKb" checked> 回答前检索知识库（材质/洗涤/尺码指南）</label>
  <div id="chat"><div class="empty">在这里输入问题，例如：这件商品多少钱 / 我 170cm 60kg 穿什么码 / 水洗加工是什么意思</div></div>
  <form id="f" class="chatbar"><input id="cq" autocomplete="off" placeholder="输入顾客的问题，或先在上方搜索选商品再提问…"><button id="send">发送</button></form>
</section>

</div>
<script>
/* ================== 基础 ================== */
const CFG = {
  zhipu: ['4d6de0f45c174dc2b76b2d6f16b87f73', '.m3k1BumFMhNRX5kC'].join(''),
  kb: ['2096197757286182912', '2096563310295195648'],
  ark: 'ark-c38a6bd9' + '-3e93-4367-9e5a-a64edcd09058-eb0f0',
  model: 'doubao-seed-character-260628'
};
const KVDB = 'https://kvdb.io/Ks73CVNzBmXEcgUhaBfkFd';
const D = window.MUJI_DATA || {products: {}, sizes: {}};
const byId = id => document.getElementById(id);
let ctxProduct = null, history = [];

window.onerror = function (msg, src, line) {
  const bar = document.createElement('div');
  bar.style.cssText = 'background:#b00;color:#fff;padding:6px 14px;font-size:12px';
  bar.textContent = '页面脚本出错：' + msg + ' @' + (src || '').split('/').pop() + ':' + line;
  document.body.insertBefore(bar, document.body.firstChild);
};

/* ================== 设备授权 ================== */
function deviceId() {
  const gen = () => 'D' + Date.now().toString(36).toUpperCase() + '-' + Math.random().toString(36).slice(2, 8).toUpperCase();
  try {
    let id = localStorage.getItem('muji_device_id');
    if (!id) { id = gen(); localStorage.setItem('muji_device_id', id); }
    return id;
  } catch (e) { return gen(); }
}
const MY_ID = deviceId();

async function recordVisit() {
  try {
    await fetch(KVDB + '/visits/' + MY_ID, {method: 'PUT', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ts: new Date().toLocaleString('zh-CN'), ua: navigator.userAgent.slice(0, 90)})});
  } catch (e) {}
}
async function checkAcl() {
  try {
    const r = await fetch(KVDB + '/acl?t=' + Date.now(), {cache: 'no-store'});
    const acl = await r.json();
    const banned = (acl.banned || []).map(x => x.id);
    const allowed = (acl.devices || []).map(x => x.id);
    if (banned.includes(MY_ID)) return 'blocked';
    if ((acl.mode || 'blacklist') === 'whitelist' && !allowed.includes(MY_ID)) return 'blocked';
    return 'ok';
  } catch (e) { return 'ok'; }
}
function showBlock() {
  document.querySelector('.wrap').innerHTML =
    `<div style="background:#fff;border:1px solid #e7e1d6;border-radius:10px;padding:40px 20px;text-align:center;margin-top:40px">
      <div style="font-size:40px">🚫</div>
      <h2 style="color:#7a0000;font-size:17px;margin:10px 0">此设备已被禁用</h2>
      <p style="color:#666;font-size:13px">设备编号：<b>${MY_ID}</b><br>如认为是误判，请联系管理员。</p>
    </div>`;
}

/* ================== 搜索工具函数 ================== */
function esc(s){ return (s||'').replace(/&/g,'&lt;').replace(/</g,'&lt;'); }
function norm(s){ return (s||'').toLowerCase().replace(/\s+/g, '').replace(/[Ａ-Ｚａ-ｚ０-９：－]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)); }
// 允许 1 个字不同的包含匹配（处理错别字）；两字词只在宽松模式下启用
function fuzzyContains(text, word, loose) {
  if (text.includes(word)) return true;
  if (word.length < (loose ? 2 : 3)) return false;
  for (let s = 0; s <= text.length - word.length; s++) {
    let diff = 0;
    for (let i = 0; i < word.length; i++) {
      if (text[s + i] !== word[i] && ++diff > 1) break;
    }
    if (diff <= 1) return true;
  }
  return false;
}

// 中文滑窗切词：长串标题切成两字grams（淘宝式长标题友好）
function bigrams(s) {
  const out = [];
  for (let i = 0; i < s.length - 1; i++) out.push(s.slice(i, i + 2));
  return out;
}
// 匹配器：返回 {sku, p, score} 数组。SKU 必须一致，中文支持多关键词+容错+长标题噪音
function matchProducts(query) {
  const q = norm(query);
  if (!q) return [];
  const isNum = /^\d+$/.test(q);
  const words = query.trim().split(/[\s,，、/]+/).map(norm).filter(w => w.length >= 2);
  const scored = [];
  for (const [sku, p] of Object.entries(D.products)) {
    if (isNum) {
      // 纯数字只搜条码：13位全等 > 前缀
      if (sku === q) scored.push({sku, p, w: 100});
      else if (sku.startsWith(q)) scored.push({sku, p, w: 80});
      continue;
    }
    const t = norm(p.t), c = norm(p.c);
    const field = t + c;
    // 标题整体出现在查询里（处理"压缩沙发多少钱"这类问法）→ 强命中
    if (t.length >= 3 && q.includes(t)) { scored.push({sku, p, w: 60}); continue; }
    // 显式多关键词（用户手动空格分隔）→ AND
    let andMode = words.length > 1;
    if (andMode) {
      if (words.every(w => field.includes(w) || fuzzyContains(field, w))) scored.push({sku, p, w: 40 + words.length * 5});
      continue;
    }
    // 单词两路：包含命中 或 长查询 bigram 覆盖率（应对淘宝长标题）
    const w0 = words[0] || '';
    if (field.includes(w0)) {
      scored.push({sku, p, w: 30 + (t.startsWith(w0) ? 8 : 0)});
    } else if (w0.length >= 6) {
      const grams = bigrams(w0);
      const hit = grams.filter(g => field.includes(g)).length;
      const cov = hit / grams.length;
      if (cov >= 0.45 && hit >= 3) scored.push({sku, p, w: Math.round(cov * 25), fuzzy: cov < 0.6});
    } else if (fuzzyContains(field, w0)) {
      scored.push({sku, p, w: 3, fuzzy: true});
    }
  }
  if (scored.length === 0 && !isNum) {
    // 全零 → 宽松兜底（错别字容错，两字词也放开）
    for (const [sku, p] of Object.entries(D.products)) {
      const field = norm(p.t) + norm(p.c);
      for (const w of words.length ? words : [q]) {
        if (w.length >= 2 && (field.includes(w) || fuzzyContains(field, w, true))) {
          scored.push({sku, p, w: 2, fuzzy: true});
          break;
        }
      }
    }
  }
  scored.sort((a, b) => b.w - a.w || (a.p.p || 0) - (b.p.p || 0));
  return scored.slice(0, 24).map(x => ({sku: x.sku, p: x.p, fuzzy: !!x.fuzzy}));
}

function search() {
  const query = byId('q').value.trim();
  const grid = byId('grid');
  if (!query) { grid.innerHTML = ''; return; }
  if (!Object.keys(D.products).length) {
    grid.innerHTML = '<div class="empty">商品数据未加载成功，请刷新页面重试（Ctrl+F5）</div>';
    return;
  }
  const hits = matchProducts(query);
  grid.innerHTML = hits.map(({sku, p, fuzzy}) => `
    <div class="card">
      <img src="${p.i || ''}" onerror="this.style.visibility='hidden'" loading="lazy">
      <div class="bd">
        <div class="t">${esc(p.t)}${fuzzy ? ' <span style="color:#999;font-size:11px">(模糊匹配)</span>' : ''}</div>
        <div class="p">¥${p.p}</div>
        <div class="s">SKU ${sku}</div>
        <div class="ops">
          <button class="solid" onclick="genScript('${sku}')">生成话术</button>
          <button onclick="toChat('${sku}')">去问答</button>
          <button onclick="window.open('${p.u || ''}','_blank')">官网</button>
        </div>
      </div>
    </div>`).join('') || '<div class="empty">没找到相关商品，换个关键词试试</div>';
}

function sizeText(sku) {
  const s = D.sizes[sku];
  if (!s) return '';
  const parts = [];
  if (s.r) parts.push('尺码推荐(号型映射)：' + s.r);
  if (s.tb) parts.push('尺码对照表(cm)：' + s.tb);
  if (s.m) parts.push('模特参考：' + s.m);
  if (s.f) parts.push('版型：' + s.f);
  return parts.length ? parts.join('；') : '尺码数据：详情未提供尺码表，按品类通用尺码回答并注明仅供参考。';
}

/* ================== 话术生成 ================== */
async function genScript(sku) {
  const p = D.products[sku];
  byId('scriptBox').style.display = 'block';
  byId('scriptTitle').textContent = '销售话术 —— ' + p.t;
  byId('scriptTxt').textContent = '生成中…';
  byId('scriptBox').scrollIntoView({behavior: 'smooth', block: 'nearest'});
  const sys = '你是无印良品的资深导购。请根据商品信息生成一段发给顾客的销售话术：1)开头一句抓住需求的推荐语；2)2-3个卖点（材质/工艺/功能，来自商品信息，不编造数字）；3)一句使用/搭配建议；4)结尾轻推下单。语气亲切不油腻，总共不超过150字，直接输出话术本身。'
    + '\n\n商品信息：\n标题：' + p.t + '\n价格：¥' + p.p + '\nSKU：' + sku + '\n分类：' + p.c + '\n材质说明：' + p.d + '\n' + sizeText(sku);
  try {
    const out = await streamArk([{'role':'system','content':sys},{'role':'user','content':'请为这个商品生成话术'}], t => byId('scriptTxt').textContent = t);
    if (!out) byId('scriptTxt').textContent = '生成失败，请重试';
  } catch (err) { byId('scriptTxt').textContent = '出错：' + err.message; }
}

/* ================== 问答 ================== */
function toChat(sku) {
  const p = D.products[sku];
  ctxProduct = {sku, ...p};
  renderCtx();
  byId('chatSec').scrollIntoView({behavior: 'smooth'});
  byId('cq').focus();
}
function renderCtx() {
  byId('ctxwrap').innerHTML = ctxProduct
    ? `<span class="ctxchip">🏷 当前商品：${esc(ctxProduct.t)} ¥${ctxProduct.p}
       <button onclick="ctxProduct=null;renderCtx()">✕</button></span>` : '';
}
async function retrieve(q) {
  const r = await fetch('https://open.bigmodel.cn/api/llm-application/open/knowledge/retrieve', {
    method: 'POST',
    headers: {'Authorization': 'Bearer ' + CFG.zhipu, 'Content-Type': 'application/json'},
    body: JSON.stringify({knowledge_ids: CFG.kb, query: q, top_k: 5, recall_method: 'mixed'})
  });
  const j = await r.json();
  return (j.data || []).map(h => ({doc: (h.metadata||{}).doc_name, score: h.score, text: h.text}));
}
async function streamArk(messages, onDelta) {
  const resp = await fetch('https://ark.cn-beijing.volces.com/api/v3/chat/completions', {
    method: 'POST',
    headers: {'Authorization': 'Bearer ' + CFG.ark, 'Content-Type': 'application/json'},
    body: JSON.stringify({model: CFG.model, messages, max_tokens: 900, stream: true, temperature: 0.7})
  });
  if (!resp.ok) throw new Error('API ' + resp.status + ' ' + (await resp.text()).slice(0, 200));
  const reader = resp.body.getReader(), dec = new TextDecoder();
  let buf = '', out = '';
  while (true) {
    const {done, value} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream: true});
    let i;
    while ((i = buf.indexOf('\n')) >= 0) {
      let line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if (line.startsWith('data:')) line = line.slice(5).trim();
      if (!line || line === '[DONE]') continue;
      try {
        const j = JSON.parse(line);
        const piece = ((j.choices||[{}])[0].delta||{}).content || '';
        if (piece) { out += piece; onDelta && onDelta(out); }
      } catch (e) {}
    }
  }
  return out;
}

byId('f').onsubmit = async e => {
  e.preventDefault();
  const q = byId('cq').value.trim();
  if (!q) return;
  byId('cq').value = '';
  const chat = byId('chat');
  const empty = chat.querySelector('.empty');
  if (empty) empty.remove();
  const add = (cls, txt) => { const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = txt; chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d; };
  add('user', q);
  const bot = add('bot typing', '');
  byId('send').disabled = true;
  let answer = '';
  try {
    let ctx = [];
    // 自动切换选中商品：条码必须全等，商品名需问题包含完整标题
    const qn = norm(q);
    let newHit = null;
    const digits = q.replace(/\D/g, '');
    if (/^\d{13}$/.test(digits)) {
      if (D.products[digits]) newHit = {sku: digits, ...D.products[digits]};
    } else {
      for (const [sku, p] of Object.entries(D.products)) {
        const t = norm(p.t);
        if (t.length >= 3 && (qn.includes(t) || t.includes(qn) && qn.length >= t.length - 2)) { newHit = {sku, ...p}; break; }
      }
    }
    if (newHit && (!ctxProduct || newHit.sku !== ctxProduct.sku)) {
      ctxProduct = newHit;
      renderCtx();
    }
    if (ctxProduct) {
      ctx.push(`【选中商品】${ctxProduct.t}\n价格：¥${ctxProduct.p}\nSKU：${ctxProduct.sku}\n分类：${ctxProduct.c}\n材质说明：${ctxProduct.d}\n${sizeText(ctxProduct.sku)}`);
    }
    if (byId('useKb').checked) {
      const hits = await retrieve(q);
      if (hits.length) {
        const d = document.createElement('details');
        d.className = 'refs';
        d.innerHTML = `<summary>📚 命中知识库 ${hits.length} 条</summary><ul>` +
          hits.map(r => `<li><b>${esc(r.doc)}</b>（${Number(r.score).toFixed(2)}）${esc((r.text||'').slice(0,140))}…</li>`).join('') + '</ul>';
        chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
        ctx.push(...hits.map(h => `（来源:${h.doc}）${h.text}`));
      }
    }
    const sys = '你是无印良品（MUJI）的资深导购助手。\n'
      + '1. 上下文里有对应商品时：价格、SKU、材质必须照抄原文，不改数字。\n'
      + '2. 顾客发条码时只允许回答精确命中的商品；标注"未命中"就必须说查不到，不得猜。\n'
      + '3. 材质/工艺/洗涤知识可正常科普。\n'
      + '4. 顾客报身高体重问尺码：优先用商品的号型映射和对照表推码数并说明依据（号型160/84A=身高160胸围84），版型修身建议大一码；无具体表时用通用尺码并注明仅供参考；童装按身高，牛仔裤按腰围英寸。\n'
      + '5. 语气亲切像门店导购，3~5句，不提"知识库/上下文"这些词。\n'
      + '6. 【选中商品】只是用户上一个关注点：如果用户这次的问题提到别的商品名/条码，或明显在问别的话题，就以新问题为准回答，不要继续围着选中商品打转；上下文里若有【精确命中的商品】，优先回答用户这次问到的。\n\n【上下文】\n' + (ctx.join('\n---\n') || '（无）');
    const msgs = [{'role': 'system', 'content': sys}];
    for (const h of history.slice(-6)) { msgs.push({'role':'user','content':h.q}); msgs.push({'role':'assistant','content':h.a}); }
    msgs.push({'role': 'user', 'content': q});
    answer = await streamArk(msgs, t => { bot.textContent = t; chat.scrollTop = chat.scrollHeight; });
    bot.textContent = answer || '（空回复，请重试）';
  } catch (err) {
    bot.textContent = '出错：' + err.message;
  }
  bot.classList.remove('typing');
  history.push({q, a: answer});
  byId('send').disabled = false;
};

/* ================== 图片识款 ================== */
async function visionCall(b64dataUrl, prompt) {
  const content = [{'type': 'image_url', 'image_url': {'url': b64dataUrl}}, {'type': 'text', 'text': prompt}];
  const tryReq = (url, key, model) => fetch(url, {
    method: 'POST',
    headers: {'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json'},
    body: JSON.stringify({model, messages: [{'role': 'user', 'content': content}], max_tokens: 500, temperature: 0.1})
  });
  let r;
  try {
    r = await tryReq('https://open.bigmodel.cn/api/paas/v4/chat/completions', CFG.zhipu, 'glm-4v-flash');
    if (!r.ok) throw new Error('glm ' + r.status);
  } catch (e) {
    r = await tryReq('https://ark.cn-beijing.volces.com/api/v3/chat/completions', CFG.ark, 'doubao-seed-1-6-vision-250815');
  }
  const j = await r.json();
  return (((j.choices || [{}])[0].message || {}).content || '').trim();
}
function compressImage(file) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 900 / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * scale);
      cv.height = Math.round(img.height * scale);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      resolve(cv.toDataURL('image/jpeg', 0.85));
    };
    img.src = URL.createObjectURL(file);
  });
}
async function handleImage(file) {
  const chat = byId('chat');
  const empty = chat.querySelector('.empty');
  if (empty) empty.remove();
  const add = (cls, txt) => { const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = txt; chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d; };
  const status = add('user', '📷 [发送了一张图片，识别中…]');
  const bot = add('bot typing', '看图识别中…');
  try {
    const dataUrl = await compressImage(file);
    const desc = await visionCall(dataUrl,
      '你是MUJI无印良品商品识别助手。顾客发来一张照片，可能是商品吊牌/标签，也可能是商品实物。仔细看图并只输出一个JSON，格式：{"mode":"tag","barcode":"吊牌上455开头的13位条码数字,读不到则空字符串","name":"吊牌上印刷的中文品名(如:文件夹(环扣式)),实物照则空","desc":"实物照则描述:品类、男女装或儿童、颜色、材质、版型细节;吊牌照则空"}。注意:条码数字必须逐位仔细读,不要遗漏或臆造;除JSON外不要输出任何其他文字。');
    let info = {};
    try { info = JSON.parse(desc.replace(/```json|```/g, '').trim()); } catch (e) {}
    let candidates = [];
    if (info.barcode && /^\d{13}$/.test(info.barcode) && D.products[info.barcode]) {
      candidates = [{sku: info.barcode, p: D.products[info.barcode]}];
      bot.textContent = '✅ 吊牌识别成功（条码 ' + info.barcode + '）';
    } else if (info.barcode && /^\d{13}$/.test(info.barcode)) {
      bot.textContent = '读到了条码 ' + info.barcode + '，但这个条码不在商品库里。';
    }
    if (!candidates.length) {
      const q = (info.name || '') + ' ' + (info.desc || '');
      candidates = matchProducts(q || (info.name || '')).slice(0, 5);
      bot.textContent = info.name ? ('识别到：' + info.name + (info.desc ? '｜' + info.desc : '')) : (info.desc || '没能识别出商品，请换张清晰的照片。');
    }
    if (candidates.length) {
      const d = document.createElement('div');
      d.className = 'refs';
      d.style.width = '95%';
      d.innerHTML = '<b>疑似款（点击选用）：</b><div id="grid" style="margin-top:8px">' +
        candidates.map(({sku, p, fuzzy}) => `
        <div class="card">
          <img src="${p.i || ''}" onerror="this.style.visibility='hidden'" loading="lazy">
          <div class="bd">
            <div class="t">${esc(p.t)}${fuzzy ? ' <span style="color:#999;font-size:11px">(模糊匹配)</span>' : ''}</div>
            <div class="p">¥${p.p}</div>
            <div class="s">SKU ${sku}</div>
            <div class="ops">
              <button class="solid" onclick="pickProduct('${sku}')">选这个</button>
              <button onclick="window.open('${p.u || ''}','_blank')">官网</button>
            </div>
          </div>
        </div>`).join('') + '</div>';
      chat.appendChild(d);
    }
  } catch (err) {
    bot.textContent = '识别出错：' + err.message;
  }
  bot.classList.remove('typing');
  status.textContent = '📷 [发送了一张图片]';
  chat.scrollTop = chat.scrollHeight;
}
function pickProduct(sku) {
  const p = D.products[sku];
  ctxProduct = {sku, ...p};
  renderCtx();
  byId('chatSec').scrollIntoView({behavior: 'smooth'});
}

document.addEventListener('paste', e => {
  const items = (e.clipboardData || {}).items || [];
  for (const it of items) {
    if (it.type && it.type.startsWith('image/')) {
      e.preventDefault();
      handleImage(it.getAsFile());
      return;
    }
  }
});
